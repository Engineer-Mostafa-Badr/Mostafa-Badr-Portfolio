<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Mostafa Badr</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root {
      color-scheme: dark;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", sans-serif;
      background: radial-gradient(ellipse at top left, #0A1230 0%, #050A1A 50%, #0E0B26 100%);
      color: #E5E7EB;
      overflow: hidden;
    }
    .wrap {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 24px;
      position: relative;
    }
    .orb {
      position: absolute;
      width: 380px;
      height: 380px;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.30;
      pointer-events: none;
    }
    .orb.gold { background: #FFD700; top: -100px; left: -80px; }
    .orb.cyan { background: #40C4FF; bottom: -120px; right: -80px; opacity: 0.25; }
    .orb.purple { background: #9C7BFF; top: 40%; left: 50%; transform: translate(-50%, -50%); opacity: 0.18; }
    .card {
      position: relative;
      max-width: 520px;
      text-align: center;
      padding: 48px 32px;
      background: rgba(14, 21, 43, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 24px;
      backdrop-filter: blur(8px);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.50);
    }
    .code {
      font-size: 96px;
      font-weight: 900;
      letter-spacing: -4px;
      background: linear-gradient(135deg, #FFD700, #40C4FF, #9C7BFF);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: #94A3B8;
      margin-bottom: 24px;
    }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    a.btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13.5px;
      text-decoration: none;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    a.btn.primary {
      background: #FFD700;
      color: #050A1A;
      box-shadow: 0 8px 24px rgba(255, 215, 0, 0.35);
    }
    a.btn.primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(255, 215, 0, 0.45);
    }
    a.btn.ghost {
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.20);
    }
    a.btn.ghost:hover {
      background: rgba(255, 255, 255, 0.06);
    }
    .tag {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      background: rgba(64, 196, 255, 0.10);
      border: 1px solid rgba(64, 196, 255, 0.30);
      color: #40C4FF;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 1.5px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="orb gold"></div>
    <div class="orb cyan"></div>
    <div class="orb purple"></div>
    <div class="card">
      <span class="tag">404 · NOT FOUND</span>
      <div class="code">404</div>
      <h1>This page took a wrong turn.</h1>
      <p>The page you're looking for doesn't exist — maybe the URL is stale, or maybe I haven't shipped that yet.<br>Either way, let's get you back to the portfolio.</p>
      <div class="actions">
        <a class="btn primary" href="/">← Back to home</a>
        <a class="btn ghost" href="https://wa.me/201004652998" target="_blank" rel="noopener">Message me</a>
      </div>
    </div>
  </div>
</body>
</html>
