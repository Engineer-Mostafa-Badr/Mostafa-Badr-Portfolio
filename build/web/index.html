  <!-- Branded splash — visible while Flutter is bootstrapping (~3s on cold load).

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #050A1A;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #mb-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 30% 20%, rgba(255, 215, 0, 0.10) 0%, transparent 50%),
        radial-gradient(circle at 70% 80%, rgba(64, 196, 255, 0.10) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(156, 123, 255, 0.08) 0%, transparent 60%),
        linear-gradient(135deg, #050A1A 0%, #0A1230 50%, #0E0B26 100%);
      transition: opacity 600ms ease-out;
    }
    #mb-splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .mb-logo {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      background: linear-gradient(135deg, #FFD700 0%, #40C4FF 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #050A1A;
      font-size: 38px;
      font-weight: 900;
      letter-spacing: -2px;
      box-shadow:
        0 12px 40px rgba(64, 196, 255, 0.35),
        0 0 80px rgba(255, 215, 0, 0.18);
      animation: mb-pulse 2s ease-in-out infinite;
    }
    @keyframes mb-pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.06); }
    }
    .mb-name {
      color: #ffffff;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.4px;
      margin-top: 22px;
    }
    .mb-tagline {
      color: rgba(255, 255, 255, 0.55);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.8px;
      margin-top: 6px;
      text-transform: uppercase;
    }
    .mb-progress {
      width: 160px;
      height: 3px;
      margin-top: 26px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }
    .mb-progress::after {
      content: '';
      position: absolute;
      inset: 0;
      width: 40%;
      background: linear-gradient(90deg, transparent, #40C4FF, transparent);
      border-radius: 2px;
      animation: mb-slide 1.4s ease-in-out infinite;
    }
    @keyframes mb-slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
  </style>

<body>
  <!-- Branded splash screen — removed by Flutter after first frame -->
  <div id="mb-splash">
    <div class="mb-logo">MB</div>
    <div class="mb-name">Mostafa Badr</div>
    <div class="mb-tagline">Flutter · Odoo</div>
    <div class="mb-progress"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Hide the splash as soon as Flutter takes over the page.
    // Two safety nets:
    //   1. flutter-first-frame event (preferred — fires after first paint)
    //   2. 8s timeout fallback in case the event never fires
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('mb-splash');
      if (!splash) return;
      splash.classList.add('fade-out');
      setTimeout(function () { splash.remove(); }, 700);
    });
    setTimeout(function () {
      var splash = document.getElementById('mb-splash');
      if (splash && !splash.classList.contains('fade-out')) {
        splash.classList.add('fade-out');
        setTimeout(function () { splash.remove(); }, 700);
      }
    }, 8000);
  </script>
</body>
